# Site settings
locale: "en-US"
title: Skyler Walcoff
tagline: Mechanical Engineering
name: Skyler Walcoff
email: sw2368@cornell.edu
description: Skyler Walcoff is a mechanical engineering student at Cornell who leads the Cornell Autonomous Sailboat Team.

# baseurl is left unset on purpose: GitHub Pages fills it in from the repo name,
# so the site keeps working if the repo is renamed.
# To preview locally: bundle exec jekyll serve

sass:
  style: compressed

permalink: /:categories/:title/

collections:
  pages:
    output: true
  projects:
    output: true
    permalink: /:collection/:path/

markdown: kramdown
kramdown:
  input: GFM

plugins:
  - jekyll-feed
  - jekyll-include-cache
  - jekyll-seo-tag

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
