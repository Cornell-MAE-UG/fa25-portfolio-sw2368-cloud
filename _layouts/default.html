<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.url == "/" %}{{ site.title }} | {{ site.tagline }}{% else %}{{ page.title }} | {{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.summary | default: site.description }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ "/assets/css/main.css" | relative_url }}">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="site-head">
    <a class="brand" href="{{ "/" | relative_url }}">{{ site.title }}</a>
    <nav aria-label="Main">
      <a href="{{ "/projects/" | relative_url }}"{% if page.url contains '/projects/' %} aria-current="page"{% endif %}>Projects</a>
      <a href="{{ "/cv/" | relative_url }}"{% if page.url == '/cv/' %} aria-current="page"{% endif %}>CV</a>
      <a href="mailto:{{ site.email }}">Email</a>
    </nav>
  </header>
  <main id="main">
    {{ content }}
  </main>
  <footer class="site-foot">
    <p>{{ site.name }}, Cornell University</p>
    <p><a href="mailto:{{ site.email }}">{{ site.email }}</a></p>
  </footer>
</body>
</html>
