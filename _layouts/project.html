---
layout: default
---
<article class="project">
  <header class="project-head">
    <p class="project-course">{{ page.course }}</p>
    <h1>{{ page.title }}</h1>
    <p class="project-summary">{{ page.summary }}</p>
    <p class="project-tools">{{ page.technologies | join: ", " }}</p>
  </header>
  <div class="prose">
    {{ content }}
  </div>
  <p class="back"><a href="{{ "/projects/" | relative_url }}">All projects</a></p>
</article>
